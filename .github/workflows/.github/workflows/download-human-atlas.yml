name: Télécharger les modèles anatomiques

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer DN Med Study
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Télécharger les modèles 3D
        run: node scripts/download-human-atlas.mjs

      - name: Enregistrer les fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/human-atlas
          git diff --cached --quiet || (
            git commit -m "Add detailed Human Atlas anatomy models"
            git push
          )
